name: ZipDial
description: ZipDial was a Bangalore, India based mobile marketing and analytics startup founded in
  2010 that pioneered "missed call" engagement, letting consumers interact with brands and campaigns
  by giving a toll-free number a missed call rather than paying for a call or SMS. It was acquired by
  Twitter in January 2015 and its standalone product was subsequently wound down. The company was
  backed by 500 Global (formerly 500 Startups) among other investors. As of this enrichment pass the
  original company is defunct and no longer operates a developer program or public API; the zipdial.com
  domain now resolves to an unrelated general-interest content/news aggregation site with no developer,
  documentation, or API surface. This profile is retained as a historical portfolio-company record.
